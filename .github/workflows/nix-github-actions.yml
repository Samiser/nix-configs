name: Nix Flake actions

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.samiser.xyz/main https://noctalia.cachix.org
            extra-trusted-public-keys = main:xTlqL+c6HRCxNLtRdVu+TElyY+HD9WiXQn0fSetkbFk= noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4=
      - id: discover
        name: Generate check matrix
        run: |
          set -Eeuo pipefail
          matrix="$(nix eval --json .#ciMatrix | jq -c '
            {"x86_64-linux": "ubuntu-latest",
             "aarch64-linux": "ubuntu-24.04-arm",
             "x86_64-darwin": "macos-13",
             "aarch64-darwin": "macos-latest"} as $os |
            {include: map(. + {os: $os[.system]})}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          jq -r '.include[] | "  \(.name) (\(.system))"' <<< "$matrix"

  push-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.samiser.xyz/main https://noctalia.cachix.org
            extra-trusted-public-keys = main:xTlqL+c6HRCxNLtRdVu+TElyY+HD9WiXQn0fSetkbFk= noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4=
      - name: Push flake inputs to Attic cache
        run: |
          set -Eeuo pipefail
          nix profile install --inputs-from . nixpkgs#attic-client
          attic login cache https://cache.samiser.xyz ${{ secrets.ATTIC_TOKEN }}
          nix flake archive --json \
            | jq -r '[.. | .path? | strings] | unique[]' \
            | xargs attic push main

  check:
    name: ${{ matrix.name }} (${{ matrix.system }})
    needs: discover
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.samiser.xyz/main https://noctalia.cachix.org
            extra-trusted-public-keys = main:xTlqL+c6HRCxNLtRdVu+TElyY+HD9WiXQn0fSetkbFk= noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4=
      - name: Evaluate, build if uncached, push
        run: |
          set -Eeuo pipefail
          attr='.#checks."${{ matrix.system }}"."${{ matrix.name }}"'
          eval="$(nix eval --json "$attr" --apply 'd: { drv = d.drvPath; out = d.outPath; }')"
          drv="$(jq -r '.drv' <<< "$eval")"
          out="$(jq -r '.out' <<< "$eval")"
          hash="$(basename "$out" | cut -d- -f1)"

          if curl -sf -o /dev/null "https://cache.samiser.xyz/main/$hash.narinfo"; then
            echo "$out already cached, nothing to do"
            exit 0
          fi

          nix build -L --no-link "$drv^*"

          nix profile install --inputs-from . nixpkgs#attic-client
          attic login cache https://cache.samiser.xyz ${{ secrets.ATTIC_TOKEN }}
          attic push main "$drv"
          nix build --no-link --print-out-paths "$drv^*" | xargs attic push main
