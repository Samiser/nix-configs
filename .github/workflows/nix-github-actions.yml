name: Nix Flake actions

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-eval:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.eval.outputs.matrix }}
      uncached: ${{ steps.eval.outputs.uncached }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.samiser.xyz/main
            extra-trusted-public-keys = main:xTlqL+c6HRCxNLtRdVu+TElyY+HD9WiXQn0fSetkbFk=
            eval-cache = false
      - id: eval
        name: Evaluate flake and generate matrix
        run: |
          set -Eeuo pipefail
          nix run --inputs-from . nixpkgs#nix-eval-jobs -- \
            --workers 2 --max-memory-size 3500 --force-recurse --check-cache-status \
            --flake '.#checks' > jobs.jsonl

          if jq -es 'map(select(.error)) | length > 0' jobs.jsonl > /dev/null; then
            echo "Evaluation errors:" >&2
            jq -r 'select(.error) | "\(.attr): \(.error)"' jobs.jsonl >&2
            exit 1
          fi

          matrix="$(jq -cs '
            {"x86_64-linux": "ubuntu-latest",
             "aarch64-linux": "ubuntu-24.04-arm",
             "x86_64-darwin": "macos-13",
             "aarch64-darwin": "macos-latest"} as $os |
            {include: map(select(.isCached | not) | {
              name: (.attrPath | last),
              system: .system,
              os: $os[.system],
              drvPath: .drvPath
            })}' jobs.jsonl)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "uncached=$(jq -r '.include | length' <<< "$matrix")" >> "$GITHUB_OUTPUT"

          echo "$(jq -r '.include | length' <<< "$matrix") uncached job(s):"
          jq -r '.include[] | "  \(.name) (\(.system))"' <<< "$matrix"
      - name: Push derivations to Attic cache
        if: steps.eval.outputs.uncached != '0'
        run: |
          set -Eeuo pipefail
          nix profile install --inputs-from . nixpkgs#attic-client
          attic login cache https://cache.samiser.xyz ${{ secrets.ATTIC_TOKEN }}
          jq -r 'select(.error | not) | select(.isCached | not) | .drvPath' jobs.jsonl \
            | xargs nix-store --query --requisites \
            | sort -u \
            | xargs attic push main

  nix-build:
    name: ${{ matrix.name }} (${{ matrix.system }})
    needs: nix-eval
    if: needs.nix-eval.outputs.uncached != '0'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.nix-eval.outputs.matrix) }}
    steps:
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.samiser.xyz/main
            extra-trusted-public-keys = main:xTlqL+c6HRCxNLtRdVu+TElyY+HD9WiXQn0fSetkbFk=
      - name: Fetch derivation from cache
        run: nix copy --from https://cache.samiser.xyz/main '${{ matrix.drvPath }}'
      - name: Build
        run: nix build -L --no-link '${{ matrix.drvPath }}^*'
      - name: Push to Attic cache
        run: |
          nix profile install nixpkgs#attic-client
          attic login cache https://cache.samiser.xyz ${{ secrets.ATTIC_TOKEN }}
          nix build --no-link --print-out-paths '${{ matrix.drvPath }}^*' | xargs attic push main
